<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0B0B0C; --paper:#FAFAF9; --g1:#F2F2F0; --g2:#E4E4E1; --g3:#A1A1AA; --g4:#52525B;
    --s:#07CF65; --s-deep:#0A5C33; --s-tint:#E3F8EC;
  }
  * { box-sizing:border-box; margin:0; padding:0 }
  html, body { height:100%; background:var(--ink); color:var(--ink); font-family:Geist, system-ui, sans-serif; overflow:hidden }
  #viewport { position:fixed; inset:0; display:grid; place-items:center }
  #stage { width:1600px; height:900px; position:relative; transform-origin:center; flex:none }
  .slide { position:absolute; inset:0; padding:88px 112px; background:var(--paper); opacity:0; visibility:hidden; transition:opacity .45s ease, visibility 0s .45s; overflow:hidden }
  .slide.on { opacity:1; visibility:visible; transition:opacity .45s ease }
  .slide.dark { background:var(--ink); color:var(--paper) }
  h1 { font-size:76px; line-height:1.04; font-weight:700; letter-spacing:-.03em }
  h2 { font-size:56px; line-height:1.08; font-weight:700; letter-spacing:-.025em; margin-bottom:48px }
  .lead { font-size:28px; line-height:1.4; color:var(--g4) }
  .dark .lead { color:var(--g3) }
  .label { font-size:18px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--s-deep); margin-bottom:20px }
  .dark .label { color:var(--s) }
  .step { opacity:0; transform:translateY(16px); transition:opacity .5s ease, transform .5s ease; pointer-events:none }
  .step.shown { opacity:1; transform:none; pointer-events:auto }

  /* slide 1 */
  .logos { display:flex; align-items:center; gap:28px; margin-bottom:96px }
  .tile { width:120px; height:120px; border-radius:28px; display:grid; place-items:center; background:#fff; transform:scale(.4); opacity:0; overflow:hidden }
  .tile img { max-width:78%; max-height:78% }
  .tile.vs { background:var(--ink); border:2px solid #27272A }
  .tile .word { font-weight:700; font-size:22px; color:var(--ink) }
  .tile.vs .word { color:var(--paper) }
  .on .tile { animation:pop .6s cubic-bezier(.3,1.6,.5,1) forwards }
  .on .tile.vs { animation-delay:.25s }
  @keyframes pop { to { transform:scale(1); opacity:1 } }
  .wire { width:160px; height:6px }
  .wire line { stroke:var(--s); stroke-width:4; stroke-dasharray:10 10; stroke-dashoffset:160 }
  .on .wire line { animation:draw .7s .5s ease forwards, flow 1s 1.2s linear infinite }
  @keyframes draw { from { stroke-dasharray:0 160 } to { stroke-dasharray:10 10; stroke-dashoffset:0 } }
  @keyframes flow { to { stroke-dashoffset:-40 } }
  .rise { display:block; overflow:hidden }
  .rise > span { display:inline-block; transform:translateY(110%) }
  .on .rise > span { animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards }
  @keyframes rise { to { transform:none } }
  .fadeup { opacity:0; transform:translateY(12px) }
  .on .fadeup { animation:fadeup .7s 1.3s ease forwards }
  @keyframes fadeup { to { opacity:1; transform:none } }
  .footer { position:absolute; left:112px; bottom:64px; font-size:18px; color:var(--g4) }
  .dark .footer { color:var(--g4) }

  /* slide 2 */
  .asks { display:flex; flex-direction:column; gap:18px; max-width:880px }
  .ask { display:flex; align-items:baseline; gap:20px; opacity:0; transform:translateX(-24px) }
  .on .ask { animation:arrive .5s ease forwards }
  @keyframes arrive { to { opacity:1; transform:none } }
  .bubble { background:var(--s-tint); color:var(--ink); border-radius:22px 22px 22px 6px; padding:14px 22px; font-size:26px; font-weight:500 }
  .needs { font-size:20px; color:var(--g4) }
  .chain { display:flex; align-items:center; gap:22px; margin-top:56px; font-size:26px; font-weight:600 }
  .chain .node { padding:12px 22px; border-radius:14px; background:var(--g1) }
  .chain .node.p { background:var(--s); color:#fff }
  .chain .node.detour { background:transparent; border:2px dashed var(--g3); font-style:italic; font-weight:500; color:var(--g4) }
  .chain .arrow { color:var(--g3) }
  .caption { margin-top:20px; font-size:22px; color:var(--g4) }

  /* slide 3 */
  .demo-wrap { display:grid; grid-template-columns:1fr 440px; gap:40px; align-items:stretch }
  .frame { position:relative; border-radius:22px; overflow:hidden; background:var(--g1); border:1px solid var(--g2); height:500px }
  .frame .shot { position:absolute; inset:0; background-size:cover; background-position:top center; filter:saturate(.6) blur(1px); opacity:.35 }
  .mock { position:absolute; left:32px; right:32px; top:28px; bottom:28px; background:#fff; border-radius:18px; box-shadow:0 20px 60px rgba(0,0,0,.12); padding:26px 30px; display:flex; flex-direction:column; gap:16px }
  .mock-top { display:flex; align-items:center; justify-content:space-between }
  .mock-title { font-weight:700; font-size:20px; color:var(--s-deep) }
  .stepper { display:flex; gap:8px }
  .stepper span { font-size:15px; padding:6px 14px; border-radius:99px; background:var(--g1); color:var(--g4) }
  .stepper span.cur { background:var(--s); color:#fff }
  .goal-h { font-size:26px; font-weight:700 }
  .goal { border:1.5px solid var(--g2); border-radius:14px; padding:14px 18px; font-size:21px; min-height:56px }
  .goal .caret { display:inline-block; width:2px; height:22px; background:var(--s); vertical-align:middle; animation:blink 1s steps(1) infinite }
  @keyframes blink { 50% { opacity:0 } }
  .nextbtn { align-self:flex-end; font:600 17px Geist; padding:10px 18px; border-radius:12px; border:0; background:var(--g1); color:var(--ink); transition:all .2s }
  .nextbtn.press { background:var(--s); color:#fff; transform:scale(.96) }
  .agent { background:var(--g1); border-radius:16px 16px 16px 6px; padding:14px 18px; font-size:20px; line-height:1.4; max-width:86%; opacity:0; transform:translateY(8px); transition:all .4s }
  .agent.in { opacity:1; transform:none }
  .connect-row { display:flex; align-items:center; gap:18px; opacity:0; transition:opacity .4s }
  .connect-row.in { opacity:1 }
  .connect { font:600 19px Geist; padding:13px 24px; border-radius:12px; border:0; background:var(--s); color:#fff }
  .connect.pulse { animation:pulse 1s ease infinite }
  .connect.done { background:var(--s-deep) }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 color-mix(in srgb, var(--s) 60%, transparent) } 50% { box-shadow:0 0 0 14px transparent } }
  .connect-cap { font-size:17px; color:var(--g4) }
  .replay { position:absolute; right:16px; bottom:12px; font:500 14px Geist; border:0; background:transparent; color:var(--g4); cursor:pointer; z-index:2 }
  .powered { background:var(--ink); color:var(--paper); border-radius:22px; padding:36px 34px }
  .powered h3 { font-size:28px; font-weight:700 }
  .powered .sub { font-size:17px; color:var(--g3); margin:6px 0 28px }
  .powered li { list-style:none; display:flex; gap:14px; font-size:21px; line-height:1.35; margin-bottom:22px; color:var(--g3); transition:color .3s }
  .powered li .tick { flex:none; width:26px; height:26px; border-radius:50%; border:2px solid #3F3F46; display:grid; place-items:center; font-size:15px; color:transparent; transition:all .3s }
  .powered li.ok { color:var(--paper) }
  .powered li.ok .tick { background:var(--s); border-color:var(--s); color:#fff }
  .illus { font-size:15px; color:var(--g3); margin-top:10px; font-style:italic }
  .strip { position:absolute; left:112px; right:112px; bottom:60px; background:var(--paper) }
  .strip .label { margin-bottom:14px }
  .nodes { display:flex; align-items:center }
  .n { display:flex; align-items:center; gap:12px; font-size:19px; font-weight:600; white-space:nowrap }
  .n small { display:block; font-weight:400; font-size:15px; color:var(--g4) }
  .dot { flex:none; width:46px; height:46px; border-radius:50%; background:var(--ink); display:grid; place-items:center; overflow:hidden }
  .dot img { width:60%; height:60% ; object-fit:contain }
  .dot.p { background:var(--s) }
  .dot.white { background:#fff; border:1px solid var(--g2) }
  .dot .t { color:#fff; font-weight:700; font-size:18px }
  .link { flex:1; height:2px; background:var(--g2); margin:0 16px; position:relative; min-width:40px }
  .link i { position:absolute; top:-4px; left:0; width:10px; height:10px; border-radius:50%; background:var(--s); opacity:0 }
  .strip.shown .link i { animation:travel 2.2s ease-in-out infinite }
  .strip.shown .link:nth-of-type(2) i { animation-delay:.5s } .strip.shown .link:nth-of-type(3) i { animation-delay:1s }
  @keyframes travel { 0% { left:0; opacity:0 } 10% { opacity:1 } 90% { opacity:1 } 100% { left:calc(100% - 10px); opacity:0 } }
  .s3-shifted .demo-wrap { transform:translateY(-36px) scale(.86); transform-origin:top left; transition:transform .5s ease }
  .demo-wrap { transition:transform .5s ease }

  /* slide 4 */
  .obj { display:grid; grid-template-columns:1fr 1fr; gap:64px }
  .quote { font-size:28px; font-style:italic; color:var(--s-deep); border-left:5px solid var(--s); padding:6px 0 6px 24px; margin-bottom:28px; line-height:1.35 }
  .answer { font-size:34px; font-weight:700; letter-spacing:-.01em; margin-bottom:14px }
  .body { font-size:23px; line-height:1.45; color:var(--g4) }
  .chips { display:flex; flex-wrap:wrap; gap:10px; margin-top:26px }
  .chip { font-size:17px; padding:8px 16px; border-radius:99px; background:var(--ink); color:var(--paper) }
  .banner { position:absolute; left:112px; right:112px; bottom:80px; background:var(--ink); color:var(--paper); font-size:32px; font-weight:700; padding:30px 40px; border-radius:20px; clip-path:inset(0 100% 0 0); transition:clip-path .8s cubic-bezier(.6,0,.2,1); opacity:1; transform:none }
  .banner.shown { clip-path:inset(0 0 0 0) }
  .banner b { color:var(--s) }

  /* slide 5 */
  .steps5 { position:relative; display:grid; grid-template-columns:repeat(4,1fr); gap:40px; margin-top:24px }
  .rail { position:absolute; left:28px; right:calc(25% - 12px); top:27px; height:3px; background:#27272A }
  .rail i { position:absolute; inset:0; background:var(--s); transform-origin:left; transform:scaleX(0); transition:transform .6s ease }
  .s5 { position:relative }
  .num { width:56px; height:56px; border-radius:50%; background:#18181B; border:2px solid #3F3F46; color:var(--g3); display:grid; place-items:center; font-size:22px; font-weight:700; margin-bottom:26px; transition:all .4s }
  .s5.shown .num { background:var(--s); border-color:var(--s); color:#fff }
  .s5 h4 { font-size:28px; font-weight:700; margin-bottom:10px }
  .s5 p { font-size:21px; line-height:1.45; color:var(--g3) }
  code { font-family:'Geist Mono', monospace; font-size:.92em; color:var(--s) }
  .then { margin-top:72px; font-size:26px; color:var(--s); font-weight:600 }

  /* chrome */
  #bar { position:fixed; right:18px; bottom:14px; display:flex; gap:6px; align-items:center; z-index:10; font:500 14px Geist; color:#A1A1AA }
  #bar button { font:inherit; color:#E4E4E7; background:rgba(39,39,42,.85); border:0; border-radius:8px; padding:7px 11px; cursor:pointer }
  #count { padding:0 6px }
  #notes { position:fixed; left:0; right:0; bottom:0; max-height:34vh; overflow:auto; background:rgba(11,11,12,.96); color:#E4E4E7; font:16px/1.55 Geist; padding:18px 24px 56px; transform:translateY(100%); transition:transform .3s; z-index:9 }
  #notes.open { transform:none }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:0s !important; animation-delay:0s !important; transition-duration:0s !important }
  }
  @media print {
    html, body { overflow:visible; background:#fff } #bar, #notes { display:none }
    #viewport { position:static; display:block } #stage { transform:none !important }
    .slide { position:relative; opacity:1; visibility:visible; page-break-after:always; width:1600px; height:900px }
    .step, .ask, .tile, .fadeup, .rise > span { opacity:1 !important; transform:none !important; animation:none !important }
    .banner { clip-path:none } .agent, .connect-row { opacity:1 }
    @page { size:1600px 900px; margin:0 }
  }
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="notes"></div>
<div id="bar">
  <button id="prev" aria-label="Back">←</button><span id="count"></span><button id="next" aria-label="Next">→</button>
  <button id="notesBtn">Notes</button><button id="fsBtn">Full screen</button>
</div>
<script>
const D = /*__DATA__*/null;
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e };
const root = document.documentElement.style;
root.setProperty('--s', D.partner.color); root.setProperty('--s-deep', D.partner.deep); root.setProperty('--s-tint', D.partner.tint);
document.title = 'viaSocket × ' + D.partner.name;

function logoTile(cls, src, word) {
  const t = el('div', 'tile ' + cls);
  if (src) { const i = el('img'); i.src = src; i.alt = word; t.append(i) } else t.append(el('span', 'word', word));
  return t;
}
function dot(icon) {
  const d = el('div', 'dot');
  if (icon === 'partner') { d.classList.add(D.assets.partnerLogo ? 'white' : 'p'); D.assets.partnerLogo ? d.append(Object.assign(el('img'), { src: D.assets.partnerLogo })) : d.append(el('span', 't', D.partner.name[0])) }
  else if (icon === 'viasocket') { D.assets.viasocketLogo ? (d.classList.add('white'), d.append(Object.assign(el('img'), { src: D.assets.viasocketLogo }))) : d.append(el('span', 't', 'v')) }
  else if (icon && D.assets.brands[icon]) d.append(Object.assign(el('img'), { src: D.assets.brands[icon] }));
  else d.append(el('span', 't', icon ? icon[0] : '•'));
  return d;
}

const slides = [];
const add = (cls, build, notes, onEnter) => { const s = el('section', 'slide ' + cls); build(s); s.dataset.notes = notes; s._enter = onEnter; $('#stage').append(s); slides.push(s) };

// 1. Title
add('dark', (s) => {
  const logos = el('div', 'logos');
  const wire = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); wire.setAttribute('class', 'wire'); wire.setAttribute('viewBox', '0 0 160 6');
  wire.innerHTML = '<line x1="0" y1="3" x2="160" y2="3"/>';
  logos.append(logoTile('', D.assets.partnerLogo, D.partner.name), wire, logoTile('vs', D.assets.viasocketLogo, 'viaSocket'));
  const h = el('h1');
  D.titleLines.forEach((line, i) => { const r = el('span', 'rise'); const sp = el('span', null, line); sp.style.animationDelay = (0.7 + i * 0.15) + 's'; r.append(sp); h.append(r) });
  s.append(logos, h, Object.assign(el('p', 'lead fadeup', D.subtitle), { style: 'margin-top:32px;max-width:1100px' }), el('div', 'footer', 'viaSocket × ' + D.partner.name + ' · Partnership proposal'));
}, D.notes[0]);

// 2. Problem
add('', (s) => {
  s.append(el('h2', null, D.problem.title));
  const g = el('div', 'step'); g.dataset.step = 0; g.classList.add('shown');
  g.append(el('div', 'label', D.problem.asksHeading));
  const asks = el('div', 'asks');
  D.problem.asks.forEach(([q, needs], i) => { const a = el('div', 'ask'); a.style.animationDelay = (0.3 + i * 0.45) + 's'; a.append(el('div', 'bubble', q), el('div', 'needs', 'needs ' + needs)); asks.append(a) });
  g.append(asks); s.append(g);
  const p = el('div', 'step'); p.dataset.step = 1;
  const chain = el('div', 'chain');
  chain.append(el('div', 'node p', D.partner.name), el('span', 'arrow', '→'), el('div', 'node detour', D.problem.detour), el('span', 'arrow', '→'), el('div', 'node', D.problem.destination));
  p.append(Object.assign(el('div', 'label', D.problem.pathHeading), { style: 'margin-top:44px;margin-bottom:0' }), chain, el('div', 'caption', D.problem.caption));
  s.append(p);
}, D.notes[1]);

// 3. Demo + trigger strip
let demoTimers = [];
add('', (s) => {
  s.append(el('h2', null, "Your UI. viaSocket’s engine."));
  const wrap = el('div', 'demo-wrap');
  const frame = el('div', 'frame');
  if (D.assets.screenshot) { const shot = el('div', 'shot'); shot.style.backgroundImage = 'url(' + D.assets.screenshot + ')'; frame.append(shot) }
  const m = el('div', 'mock');
  const top = el('div', 'mock-top'); const st = el('div', 'stepper');
  D.demo.steps.forEach((t, i) => st.append(el('span', i === 0 ? 'cur' : '', t)));
  top.append(el('div', 'mock-title', D.demo.product), st);
  const goal = el('div', 'goal');
  const next = el('button', 'nextbtn', D.demo.next);
  const agent = el('div', 'agent'); agent.append(el('b', null, D.demo.askBold + ' '), document.createTextNode(D.demo.askRest));
  const row = el('div', 'connect-row'); const btn = el('button', 'connect', D.demo.button); const cap = el('span', 'connect-cap', D.demo.captionBefore);
  row.append(btn, cap);
  m.append(top, el('div', 'goal-h', D.demo.headline), goal, next, agent, row);
  const replay = el('button', 'replay', '↻ Replay');
  frame.append(m, replay);
  const left = el('div'); left.append(frame, el('div', 'illus', 'Illustrative mock of ' + D.partner.name + '’s ' + D.demo.product + (D.assets.screenshot ? ', over a snapshot of its product' : '')));
  const pw = el('div', 'powered'); pw.append(el('h3', null, 'Powered by viaSocket'), el('div', 'sub', 'invisible to your customers'));
  const ul = el('ul'); D.demo.powered.forEach((t) => { const li = el('li'); li.append(el('span', 'tick', '✓'), el('span', null, t)); ul.append(li) }); pw.append(ul);
  wrap.append(left, pw); s.append(wrap);

  const strip = el('div', 'strip step'); strip.dataset.step = 1;
  strip.append(el('div', 'label', D.trigger.heading));
  const nodes = el('div', 'nodes');
  D.trigger.nodes.forEach(([label, sub, icon], i) => {
    if (i) { const l = el('div', 'link'); l.append(el('i')); nodes.append(l) }
    const n = el('div', 'n'); const t = el('div'); t.append(document.createTextNode(label), el('small', null, sub)); n.append(dot(icon), t); nodes.append(n);
  });
  strip.append(nodes); s.append(strip);

  const lis = ul.children;
  s._play = () => {
    demoTimers.forEach(clearTimeout); demoTimers = [];
    goal.textContent = ''; const caret = el('span', 'caret'); goal.append(caret);
    next.classList.remove('press'); agent.classList.remove('in'); row.classList.remove('in');
    btn.className = 'connect'; btn.textContent = D.demo.button; cap.textContent = D.demo.captionBefore;
    [...lis].forEach((li) => li.classList.remove('ok'));
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const at = (ms, fn) => demoTimers.push(setTimeout(fn, reduce ? 0 : ms));
    let t = 500;
    [...D.demo.goal].forEach((ch) => { at(t, () => caret.before(ch)); t += 38 });
    at(t += 400, () => next.classList.add('press'));
    at(t += 500, () => { agent.classList.add('in'); st.children[0].className = ''; st.children[1].className = 'cur' });
    at(t += 900, () => { row.classList.add('in'); btn.classList.add('pulse') });
    at(t += 1800, () => { btn.className = 'connect done'; btn.textContent = '✓ ' + D.demo.connected; cap.textContent = D.demo.captionAfter; lis[0].classList.add('ok') });
    at(t += 600, () => lis[1]?.classList.add('ok'));
    at(t += 600, () => lis[2]?.classList.add('ok'));
  };
  replay.onclick = (e) => { e.stopPropagation(); s._play() };
}, D.notes[2], (s) => s._play());

// 4. Objections
add('', (s) => {
  s.append(el('h2', null, 'Don’t we already have this covered?'));
  const g = el('div', 'obj');
  D.objections.forEach((o, i) => {
    const c = el('div', 'step'); c.dataset.step = i;
    c.append(el('div', 'quote', '“' + o.quote + '”'), el('div', 'answer', o.answer), el('div', 'body', o.body));
    if (o.chips?.length) { const ch = el('div', 'chips'); o.chips.forEach((t) => ch.append(el('span', 'chip', t))); c.append(ch) }
    g.append(c);
  });
  const b = el('div', 'banner step'); b.dataset.step = 2;
  const [a, rest] = D.banner.split('. '); b.append(el('b', null, a + '. '), document.createTextNode(rest ?? ''));
  s.append(g, b);
}, D.notes[3]);

// 5. Setup
add('dark', (s) => {
  s.append(el('h2', null, 'Live in about 15 minutes'));
  const g = el('div', 'steps5'); const rail = el('div', 'rail'); const fill = el('i'); rail.append(fill); g.append(rail);
  const steps = [['Paste the prompt', 'Into Cursor, Claude Code or Codex.'], ['Add credentials', 'Org ID, project ID and secret, kept in .env.'], ['It builds', 'Connect flow, agent tools and triggers.'], ['Real test call', 'Against a connected app.']];
  steps.forEach(([h, p], i) => {
    const c = el('div', 's5 step'); c.dataset.step = i;
    const para = el('p'); p.split('.env').forEach((part, j, arr) => { para.append(document.createTextNode(part)); if (j < arr.length - 1) para.append(el('code', null, '.env')) });
    c.append(el('div', 'num', String(i + 1)), el('h4', null, h), para); g.append(c);
  });
  const then = el('div', 'then step', 'Then a short beta with real customers.'); then.dataset.step = 4; s.append(g, then);
  s._fill = fill;
}, D.notes[4]);

// ---------- navigation ----------
let cur = 0, step = 0;
const stepsOf = (s) => Math.max(0, ...[...s.querySelectorAll('[data-step]')].map((e) => +e.dataset.step));
function render() {
  slides.forEach((s, i) => s.classList.toggle('on', i === cur));
  const s = slides[cur];
